version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stories
      POSTGRES_PASSWORD: stories_dev
      POSTGRES_DB: short_stories
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
